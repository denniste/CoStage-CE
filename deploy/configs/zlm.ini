# ZLMediaKit（CE 单机，精简配置；未列出的键走 ZLM 默认值）
# ⚠ 两处需手动核对：externIP 改为本机对外 IP；secret 若修改须同步 docker-compose.yml 里 relaybot 的 ZLM_SECRET
[general]
# 无人观看自动关流：CE 关闭（转推 bot 常驻直推；hook 不启用）
auto_close=0

[api]
apiDebug=1
secret=change-me-32-hex-secret

[rtc]
# ← 改为本机对外 IP（跨网段/公网部署必填；纯本机试玩可保留）
externIP=192.168.1.10
port=8100
tcpPort=8100
# 音频首选 opus（观看端 WHEP 原生透传）
preferredCodecA=opus

# CE 不启用 hook（观看准入 on_play 签名校验为后置能力）
[hook]
enable=0

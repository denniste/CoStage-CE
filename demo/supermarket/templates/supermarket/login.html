{% extends "supermarket/base.html" %}
{% block title %}登录 - 惠民超市{% endblock %}
{% block main %}
<div class="panel" style="max-width:380px;margin:40px auto">
  <h2 style="margin-top:0">登录</h2>
  <form method="post" style="display:grid;gap:12px">{% csrf_token %}
    <input name="username" placeholder="用户名" required style="padding:10px 12px;border:1px solid #d6dae1;border-radius:8px">
    <input name="password" type="password" placeholder="口令" required style="padding:10px 12px;border:1px solid #d6dae1;border-radius:8px">
    <button class="btn">登录</button>
    <span style="font-size:13px;color:#8a919f">还没有账号？<a href="/register/" style="color:#0f7b4f">注册</a> ｜ 员工请用工作账号登录</span>
  </form>
</div>
{% endblock %}

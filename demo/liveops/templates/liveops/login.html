<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BizHub 运营登录</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f5f7;display:grid;place-items:center;min-height:100vh;margin:0}
  .card{background:#fff;border:1px solid #e2e4e9;border-radius:12px;padding:32px;width:320px}
  h1{font-size:18px;margin:0 0 20px}
  input{width:100%;box-sizing:border-box;padding:9px 12px;margin-bottom:12px;border:1px solid #ccd0d8;border-radius:8px}
  button{width:100%;padding:10px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;cursor:pointer}
  .err{color:#c0392b;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
  <form class="card" method="post">{% csrf_token %}
    <h1>BizHub · 业务运营控制台</h1>
    {% if messages %}{% for m in messages %}<div class="err">{{ m }}</div>{% endfor %}{% endif %}
    <input name="username" placeholder="运营账号" autofocus>
    <input name="password" type="password" placeholder="口令">
    <button>登录</button>
  </form>
</body>
</html>
